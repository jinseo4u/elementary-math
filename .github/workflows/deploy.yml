name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # 빌드 과정이 없으므로 배포할 파일만 _site에 모음
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css app.js data _site/

      - name: Check data JSON
        run: |
          data_url=$(sed -n "s/^const DATA_URL = '\(.*\)';$/\1/p" _site/app.js)
          test -n "$data_url"
          test -f "_site/$data_url"
          for f in _site/data/*.json; do
            python3 -m json.tool "$f" > /dev/null
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
