name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # 빌드 과정이 없으므로 배포할 파일만 _site에 모음
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css app.js generator.js visuals.js data _site/

      - name: Check data JSON
        run: |
          for f in _site/data/*.json; do
            python3 -m json.tool "$f" > /dev/null
          done
          # 메뉴에서 활성화한 단원은 데이터 파일이 있어야 함
          cd _site
          python3 - <<'PY'
          import json, os, sys
          curriculum = json.load(open('data/curriculum-grade2.json', encoding='utf-8'))
          missing = [u['data'] for s in curriculum['semesters'] for u in s['units']
                     if u['active'] and not os.path.isfile(u['data'])]
          sys.exit(f'데이터 파일이 없습니다: {missing}' if missing else 0)
          PY

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
